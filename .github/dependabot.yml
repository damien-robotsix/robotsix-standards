# Standard ecosystems per the repo baseline (automated dependency updates).
# Python/uv lockfile updates use Renovate (see renovate.json), not Dependabot —
# Dependabot's `uv` ecosystem has unresolved lockfile update bugs
# (dependabot-core#13912).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    # No auto-merge group — these PRs require human review.
    open-pull-requests-limit: 5
