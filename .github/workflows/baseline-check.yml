name: Baseline Check

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  baseline:
    permissions:
      contents: read
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/baseline-check.yml@fb907a46b00693a117ca6b975da6e7b0f8238491 # main
    with:
      has-docker: false
      # This repo has a mill board but is docs-only: nothing consumes a
      # module registry from it, so docs/modules.yaml is exempt per the
      # repo-baseline module-registration rule.
      has-board: false

  readme-standards-link:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5  # fast grep check; well under 15-minute default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Verify README links to robotsix-standards
        run: |
          grep -q 'robotsix-standards' README.md || {
            echo "::error::README.md does not link to robotsix-standards"
            exit 1
          }
          echo "README.md standards link: OK"

  workflow-timeout-enforcement:
    # Enforcement gate for the docs/repo-baseline.md timeout-minutes rule:
    # every job with a `uses:` reusable-workflow caller must carry a
    # timeout-minutes (with a justification comment when > 15), and the
    # script flags jobs that exceed the 15-minute default without either
    # a timeout or a documented exception. See:
    #   - scripts/check-workflow-timeouts.py (the gate logic)
    #   - docs/repo-baseline.md (the timeout-minutes standard)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5  # fast grep/parse check; well under 15-minute default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Check workflow timeout-minutes rule
        run: uv run --group docs python scripts/check-workflow-timeouts.py

  license-check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5  # fast grep check; well under 15-minute default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Verify LICENSE file exists and is MIT
        run: |
          if [ ! -f LICENSE ]; then
            echo "::error::LICENSE file is missing at repo root"
            exit 1
          fi
          if ! grep -q 'MIT License' LICENSE; then
            echo "::error::LICENSE file does not identify as MIT"
            exit 1
          fi
          if ! grep -q 'Permission is hereby granted, free of charge' LICENSE; then
            echo "::error::LICENSE file is not a valid MIT license (missing grant text)"
            exit 1
          fi
          echo "LICENSE (MIT): OK"

  security-md-check:
    # Fail-closed gate for the docs/repo-baseline.md vulnerability-disclosure
    # rule: every repo must ship a SECURITY.md at the root. A missing
    # SECURITY.md fails the check (exit 1), reversing the earlier
    # warning-first behaviour.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5  # fast grep check; well under 15-minute default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Verify SECURITY.md exists at repo root
        run: |
          if [ ! -f SECURITY.md ]; then
            echo "::error::SECURITY.md file is missing at repo root"
            exit 1
          fi
          echo "SECURITY.md (vulnerability disclosure policy): OK"

  sbom-scope-check:
    # Enforcement gate for the repo-baseline.md SBOM-scope rule. This repo is
    # content-only (no src/ tree, no container image), so per docs/security-posture.md
    # it is EXEMPT from SBOM generation — there is no distributable artifact to bill
    # of materials. That scope is made machine-checkable here so an audit can verify
    # mechanically (rather than reading prose) that the exemption holds:
    #   - fail if the repo is reclassified (gains src/ or a Dockerfile) without
    #     dropping the exemption;
    #   - fail if an SBOM-generating step ever appears in a workflow — the audit gap
    #     this gate closes is 'no workflow generates the mandated SBOM'; a content-only
    #     repo should ship none, and one that does is scope creep.
    # See docs/repo-baseline.md (release-SBOM asset, content-only exemption) and
    # docs/security-posture.md (content-only exemption from the SBOM gate).
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5  # fast grep check; well under 15-minute default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Verify content-only SBOM exemption holds
        run: |
          # Content-only classification (docs/security-posture.md): no src/ tree
          # and no container-image marker.
          if [ -d src ] || find . -maxdepth 3 -iname 'Dockerfile*' -not -path './.git/*' | grep -q .; then
            echo "::error::Repo is no longer content-only (src/ or Dockerfile present); the SBOM exemption does not apply — add SBOM generation per docs/security-posture.md"
            exit 1
          fi
          # SBOM exemption applies: content-only repos must not carry an
          # SBOM-generating step or SBOM artifact upload. Match concrete
          # generator invocations and artifact names (not the bare word) so a
          # comment cannot trip it. baseline-check.yml itself is excluded from
          # the scan so this gate's own prose never self-matches.
          found=0
          for f in .github/workflows/*.yml; do
            case "$f" in
              */baseline-check.yml) continue ;;
            esac
            if grep -iqE 'anchore/sbom-action|spdx-sbom-generator|anchore/syft|trivy[[:space:]]+sbom|cyclonedx1\.[0-9]|sbom\.(cdx|cyclonedx)\.json|name:[[:space:]]*sbom' "$f"; then
              echo "::error::$f carries an SBOM-generating step in a content-only repo (docs/security-posture.md SBOM exemption)"
              found=1
            fi
          done
          [ "$found" -eq 0 ] || exit 1
          echo "SBOM scope (content-only, exempt): OK"
