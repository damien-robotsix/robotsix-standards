name: Baseline Check

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  baseline:
    permissions:
      contents: read
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/baseline-check.yml@7314c9b6c2b536ca81023e8841f272b72733262e # main
    with:
      has-docker: false
      # This repo has a mill board but is docs-only: nothing consumes a
      # module registry from it, so docs/modules.yaml is exempt per the
      # repo-baseline module-registration rule.
      has-board: false

  readme-standards-link:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Verify README links to robotsix-standards
        run: |
          grep -q 'robotsix-standards' README.md || {
            echo "::error::README.md does not link to robotsix-standards"
            exit 1
          }
          echo "README.md standards link: OK"
