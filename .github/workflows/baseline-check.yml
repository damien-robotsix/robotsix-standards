name: Baseline Check

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  baseline:
    permissions:
      contents: read
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/baseline-check.yml@fb907a46b00693a117ca6b975da6e7b0f8238491 # main
    with:
      has-docker: false
      # This repo has a mill board but is docs-only: nothing consumes a
      # module registry from it, so docs/modules.yaml is exempt per the
      # repo-baseline module-registration rule.
      has-board: false

  readme-standards-link:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5  # fast grep check; well under 15-minute default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Verify README links to robotsix-standards
        run: |
          grep -q 'robotsix-standards' README.md || {
            echo "::error::README.md does not link to robotsix-standards"
            exit 1
          }
          echo "README.md standards link: OK"

  workflow-timeout-enforcement:
    # Enforcement gate for the docs/repo-baseline.md timeout-minutes rule:
    # every job with a `uses:` reusable-workflow caller must carry a
    # timeout-minutes (with a justification comment when > 15), and the
    # script flags jobs that exceed the 15-minute default without either
    # a timeout or a documented exception. See:
    #   - scripts/check-workflow-timeouts.py (the gate logic)
    #   - docs/repo-baseline.md (the timeout-minutes standard)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5  # fast grep/parse check; well under 15-minute default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Check workflow timeout-minutes rule
        run: uv run --group docs python scripts/check-workflow-timeouts.py

  license-check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5  # fast grep check; well under 15-minute default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Verify LICENSE file exists and is MIT
        run: |
          if [ ! -f LICENSE ]; then
            echo "::error::LICENSE file is missing at repo root"
            exit 1
          fi
          if ! grep -q 'MIT License' LICENSE; then
            echo "::error::LICENSE file does not identify as MIT"
            exit 1
          fi
          if ! grep -q 'Permission is hereby granted, free of charge' LICENSE; then
            echo "::error::LICENSE file is not a valid MIT license (missing grant text)"
            exit 1
          fi
          echo "LICENSE (MIT): OK"

  security-md-check:
    # Enforcement gate for the repo-baseline.md 'Vulnerability disclosure'
    # MUST: every repo ships a root SECURITY.md carrying a reporting contact,
    # a response-time expectation, and a coordinated-disclosure statement.
    # This replaces the (unused) OpenSSF Scorecard Security-Policy check — see
    # docs/security-posture.md 'OpenSSF Scorecard — not a fleet gate'.
    # NOTE: currently warning-first (2026-09) — reports missing/non-compliant
    # SECURITY.md as annotations but does not fail. A follow-up gate will
    # flip this to fail-closed once the fleet is fully compliant.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5  # fast grep check; well under 15-minute default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check SECURITY.md exists and carries the required elements
        run: |
          if [ ! -f SECURITY.md ]; then
            echo "::warning::SECURITY.md is missing at repo root"
          elif ! grep -qiE 'mailto:|[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}' SECURITY.md; then
            echo "::warning::SECURITY.md lacks a reporting contact (no email / mailto: link found)"
          elif ! grep -qiE 'response time|business day|within [0-9]+ (business )?(day|hour|week)' SECURITY.md; then
            echo "::warning::SECURITY.md lacks a response-time expectation"
          elif ! grep -qi 'coordinated disclosure' SECURITY.md; then
            echo "::warning::SECURITY.md lacks a coordinated-disclosure statement"
          else
            echo "SECURITY.md (vulnerability disclosure): OK"
          fi
          exit 0
