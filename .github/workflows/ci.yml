name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  docs:
    # Hand-rolled gate, justified: this docs-only repo has no Python package,
    # so the shared python-ci.yml (lint/type/test/coverage) does not apply.
    # This job is the PR-time strict docs build; deployment goes through the
    # self-contained build+deploy workflow in docs.yml (the shared
    # python-docs.yml reusable causes 'Deployment failed, try again later'
    # from the Pages API for this repo).
    runs-on: ubuntu-latest
    timeout-minutes: 10  # docs build; well under 15-minute default
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Build docs (strict)
        run: uv run --group docs mkdocs build --strict
      - name: Run pre-commit hooks (markdownlint-cli2, codespell)
        uses: tox-dev/action-pre-commit-uv@e09b8958484dfe71f4ac3bc7afb230ba506402ec  # v1
        env:
          SKIP: trailing-whitespace,end-of-file-fixer,check-yaml,check-toml,check-json,check-merge-conflict,check-case-conflict,check-added-large-files,detect-private-key,detect-secrets,actionlint-docker,vale
        with:
          extra_args: --all-files
      - name: Check TOC synchronization
        run: uv run --group docs python scripts/check-toc-sync.py
      - name: Run actionlint
        uses: raven-actions/actionlint@b0e0f8e059eabdeb1c9e6e08d01cd6c0a44bd61f  # v2.1.0
        with:
          path: .github/workflows
