name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  docs:
    # Hand-rolled gate, justified: this docs-only repo has no Python package,
    # so the shared python-ci.yml (lint/type/test/coverage) does not apply.
    # This job is the PR-time strict docs build; deployment goes through the
    # self-contained build+deploy workflow in docs.yml (the shared
    # python-docs.yml reusable causes 'Deployment failed, try again later'
    # from the Pages API for this repo).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Check lockfile consistency
        run: uv lock --check
      - name: Build docs (strict)
        # htmlproofer validates internal links and anchors only
        # (validate_external_urls: false in mkdocs.yml); external URLs are
        # checked by the separate linkcheck job below, so a flaky third-party
        # host cannot fail this build.
        run: uv run --group docs mkdocs build --strict
      - name: Run pre-commit hooks (ruff, mypy, markdownlint-cli2, codespell, semgrep)
        uses: tox-dev/action-pre-commit-uv@4de52c139ed1a6963bcc4c30042c4ef9d75d8b11  # v1
        env:
          SKIP: trailing-whitespace,end-of-file-fixer,check-yaml,check-toml,check-json,check-merge-conflict,check-case-conflict,check-added-large-files,detect-private-key,detect-secrets,actionlint-docker,vale
        with:
          extra_args: --all-files
      - name: Check TOC synchronization
        run: uv run --group docs python scripts/check-toc-sync.py
      - name: Check doc structure
        run: uv run --group docs python scripts/check-doc-structure.py
      - name: Check doc example pinning (SHA-pinned uses refs in fenced examples)
        run: uv run --group docs python scripts/check-doc-example-pinning.py
      - name: Check job timeout-minutes rule
        run: uv run --group docs python scripts/check-workflow-timeouts.py
      - name: Check workflow security (4a SHA-pinning + 4c least-privilege permissions)
        run: uv run --group docs python scripts/check-workflow-security.py
      - name: Run actionlint
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar xz -C /tmp
          /tmp/actionlint .github/workflows/*.yml
      - name: Check py.typed wheel guard (self-check)
        run: uv run python scripts/check-py-typed-guard.py
      - name: Run unit tests
        run: uv run --group docs --group test python -m pytest

  linkcheck:
    name: linkcheck
    # External link validation, split out of the docs build per
    # docs/mkdocs-build.md: gates pull requests on dead external URLs, but is
    # not part of docs.yml, so an upstream outage never blocks a deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Build docs into site/
        run: uv run --group docs mkdocs build --strict
      # Exclusions (each is not an external dead link):
      # - this site's own published URLs (canonical <link> tags and
      #   sitemap.xml): internal links are already validated by htmlproofer in
      #   the docs build, and a new page's live URL 404s until it is deployed;
      # - 404.html: mkdocs renders it with root-relative links that only
      #   resolve on the served site, not in the local site/ tree;
      # - robotsix-website: a private fleet repo, 404 to the job token;
      # - the generated CHANGELOG compare link for 0.5.0: tag v0.4.0 was never
      #   published, and release-please owns that file.
      - name: Check links (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --accept 200,206,403,429,503
            --exclude-private
            --max-retries 3
            --timeout 30
            --exclude '^https://damien-robotsix\.github\.io/robotsix-standards/'
            --exclude '^https://github\.com/damien-robotsix/robotsix-website/'
            --exclude '^https://github\.com/damien-robotsix/robotsix-standards/compare/v0\.4\.0\.\.\.v0\.5\.0$'
            --exclude-path 'site/404\.html'
            --cache
            site/
