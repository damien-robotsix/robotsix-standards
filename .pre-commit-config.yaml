# Standard pre-commit set (see docs/python.md), docs-repo subset: ruff + mypy
# are scoped to scripts/ (the CI-gate Python), no vulture (no src/ package)
# and no hadolint (no Dockerfile).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: |
          (?x)(
            uv\.lock|
            \.secrets\.baseline
          )
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        files: ^scripts/
      - id: ruff-format
        files: ^scripts/
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        files: ^scripts/
        pass_filenames: false
        args: [scripts/]
        additional_dependencies: [PyYAML==6.0.3]
  # SecretStr gate (docs/config-standard.md §3): fails on any pydantic
  # config-model field whose name matches a secret pattern (api_key, token,
  # password, secret, ...) but is annotated `str` instead of SecretStr.
  - repo: local
    hooks:
      - id: check-secret-str
        name: reject str-typed secret fields in config models
        entry: python scripts/check-secret-str.py
        language: system
        types: [python]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      # detect-secrets' --exclude-files takes a SINGLE regex, not a path to a
      # pattern file — feeding it `.secrets-patterns-excluded` was a silent
      # no-op (it matched the literal filename as a regex and never read the
      # file). Path exclusions belong in the pre-commit-native `exclude:` regex
      # below, kept in sync with .secrets-patterns-excluded (which TruffleHog
      # reads directly). See docs/secret-files-are-never-tracked.md.
      - id: detect-secrets
        args:
          - '--baseline'
          - '.secrets.baseline'
        exclude: '\.secrets\.baseline$'
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        args: ["--config", ".markdownlint-cli2.yaml"]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--config", "pyproject.toml"]
  - repo: https://github.com/errata-ai/vale
    rev: v3.22.0
    hooks:
      - id: vale
        name: vale sync
        pass_filenames: false
        args: [sync]
      - id: vale
        args: [
          --output=line,
          --minAlertLevel=error,
          --glob=*.md,
        ]
  # Semgrep (SAST) — mandated by docs/repo-baseline.md 'CI and security gates'
  # and docs/security-posture.md gate 1. The fleet's shared security workflow
  # only runs bandit/pip-audit/trufflehog, so this docs repo carries its own
  # pre-commit hook (the docs-repo equivalent of python-security.yml) scoped
  # to scripts/ — the only first-party Python here (same scope as ruff/mypy).
  # p/python + p/security-audit resolve anonymously from the Semgrep Registry
  # (no SEMGREP_APP_TOKEN needed); findings fail the hook so a vulnerable
  # pattern cannot merge (OWASP ASVS 14.2.1, OWASP Top 10 A06:2021).
  #
  # Implementation note — why this is a `local` `system` hook rather than the
  # upstream `semgrep/semgrep` pre-commit hook:
  #   1. semgrep's opentelemetry → google-protobuf (upb) chain crashes at
  #      import under Python 3.14 with 'Metaclasses with custom tp_new are not
  #      supported'. It must run under 3.13.
  #   2. This repo's CI (astral-sh/setup-uv) exports UV_PYTHON=3.14, and
  #      pre-commit-uv honours UV_PYTHON *over* a hook's `language_version:`,
  #      so pinning the upstream hook to 3.13 does not stick (the env is still
  #      built as py_env-python3.14 and crashes).
  # So run semgrep out-of-band via `uv tool run` with an explicit `--python
  # 3.13` — the flag beats the UV_PYTHON env var — in an ephemeral env. semgrep
  # 1.99.0 is pinned; `setuptools<81` restores `pkg_resources` (removed in
  # setuptools 81) which semgrep's opentelemetry.instrumentation still imports.
  # `--error` makes any finding fail the hook so a vulnerable pattern cannot
  # merge; `uv` is on PATH in CI (setup-uv) so `language: system` needs no env.
  - repo: local
    hooks:
      - id: semgrep
        name: semgrep (SAST, scripts/)
        language: system
        entry: uv tool run --python 3.13 --with setuptools<81 --from semgrep==1.99.0 semgrep --config p/python --config p/security-audit --error --disable-version-check --quiet
        pass_filenames: true
        require_serial: true
        types: [python]
        files: ^scripts/
