# Standard pre-commit set (see docs/python.md), docs-repo subset: ruff + mypy
# are scoped to scripts/ (the CI-gate Python), no vulture (no src/ package)
# and no hadolint (no Dockerfile).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: |
          (?x)(
            uv\.lock|
            \.secrets\.baseline
          )
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        files: ^scripts/
      - id: ruff-format
        files: ^scripts/
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        files: ^scripts/
        pass_filenames: false
        args: [scripts/]
        additional_dependencies: [PyYAML==6.0.3]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - '--exclude-files'
          - '.secrets-patterns-excluded'
          - '--baseline'
          - '.secrets.baseline'
        exclude: '\.secrets\.baseline$'
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: ["--config", ".markdownlint-cli2.yaml"]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--config", "pyproject.toml"]
  - repo: https://github.com/errata-ai/vale
    rev: v3.19.0
    hooks:
      - id: vale
        name: vale sync
        pass_filenames: false
        args: [sync]
      - id: vale
        args: [
          --output=line,
          --minAlertLevel=error,
          --glob=*.md,
        ]
  # Semgrep (SAST) — mandated by docs/repo-baseline.md 'CI and security gates'
  # and docs/security-posture.md gate 1. The fleet's shared security workflow
  # only runs bandit/pip-audit/trufflehog, so this docs repo carries its own
  # pre-commit hook (the docs-repo equivalent of python-security.yml) scoped
  # to scripts/ — the only first-party Python here (same scope as ruff/mypy).
  # p/python + p/security-audit resolve anonymously from the Semgrep Registry
  # (no SEMGREP_APP_TOKEN needed); findings fail the hook so a vulnerable
  # pattern cannot merge (OWASP ASVS 14.2.1, OWASP Top 10 A06:2021).
  - repo: https://github.com/semgrep/semgrep
    rev: v1.99.0
    hooks:
      - id: semgrep
        # semgrep's opentelemetry → google-protobuf dependency chain does not
        # support Python 3.14 yet (upb crashes at import with 'Metaclasses
        # with custom tp_new are not supported'), and this repo's CI runs
        # pre-commit under 3.14 (see .github/workflows/ci.yml). Pin the hook
        # to 3.13, where protobuf's upb extension loads cleanly.
        language_version: python3.13
        args:
          - --config
          - p/python
          - --config
          - p/security-audit
        files: ^scripts/
