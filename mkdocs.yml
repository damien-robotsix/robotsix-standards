site_name: "Robotsix Standards"
site_url: "https://damien-robotsix.github.io/robotsix-standards/"
site_description: "Cross-cutting config and deployment standards for the robotsix stack"
repo_url: "https://github.com/damien-robotsix/robotsix-standards"

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
  language: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - attr_list
  - toc:
      permalink: true

validation:
  nav:
    not_found: warn
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

hooks:
  - docs/hooks.py

plugins:
  - search
  - htmlproofer:
      raise_error_after_finish: true
      ignore_urls:
        - "http://localhost*"
        - "https://raw.githubusercontent.com/*"
        - "https://github.com/*"
        - "https://docs.github.com/*"
        - "https://owasp.org/*"
        - "https://genai.owasp.org/*"
        - "https://damien-robotsix.github.io/*"

nav:
  - Home: index.md
  - The fleet: fleet.md
  - Every repo:
      - Repo baseline: repo-baseline.md
      - Towncrier changelog: towncrier.md
