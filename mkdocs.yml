      - Security posture: security-posture.md
      - Stale bot must exempt pull requests: stale-bot-must-exempt-pull-requests.md
      - Dependabot auto-merge: dependabot-auto-merge.md
      - Changelog & releases: changelog-driven-releases.md
      - Release-please release automation: release-please.md
      - CI lint tool pinning: ci-lint-pinning.md
      - Distribution & Packaging: distribution-packaging.md
      - Python CI workflow: python-ci-workflow.md
      - Python practices: python.md
      - Python __main__.py exit-code forwarding: python-main-py-forward.md
      - Console-script subprocess tests: console-script-subprocess-test.md
      - Python Makefile convention: python-makefile-convention.md
      - Pytest practices: pytest.md
      - Pytest shared state builders: pytest-shared-state-builders.md
      - Ruff lint rules: ruff-lint-rules.md
      - Mypy strictness: mypy.md
      - Pyright strict mode: pyright.md
      - py.typed wheel guard: py-typed-wheel-guard.md
      - Docstring convention: docstrings.md
      - HTTP client persistence: http-client-persistence.md
      - Library internal logging: library-logging.md
